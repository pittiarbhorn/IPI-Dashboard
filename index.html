<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPI-Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #0F172A;
    }
  </style>
</head>
<body class="bg-[#0F172A] text-slate-200 min-h-screen relative overflow-x-hidden">
  
  <!-- Background Glow Elements -->
  <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // จานสีสำหรับกราฟ
    const COLOR_PALETTE = [
      '#3B82F6', '#22C55E', '#F59E0B', '#EF4444', 
      '#8B5CF6', '#06B6D4', '#EC4899', '#10B981',
      '#6366F1', '#F97316', '#14B8A6', '#A855F7'
    ];

    // ฟังก์ชันแปลงข้อความตัวเลข
    const parseNumber = (val) => {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      const cleaned = String(val).replace(/,/g, '').trim();
      const parsed = parseFloat(cleaned);
      return isNaN(parsed) ? 0 : parsed;
    };

    // ฟังก์ชันใส่เครื่องหมายจุลภาคหลักพันในช่อง Input
    const formatNumberInput = (val) => {
      if (!val) return '';
      const raw = String(val).replace(/\D/g, '');
      return raw ? Number(raw).toLocaleString('en-US') : '';
    };

    // Component สำหรับ Searchable Dropdown
    function SearchableSelect({ label, options, selected, onSelect, placeholder = "พิมพ์ค้นหาผู้ชนะ..." }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const containerRef = useRef(null);

      // กรองตัวเลือกตามคำค้นหา
      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return options;
        return options.filter(opt =>
          opt.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [options, searchTerm]);

      // ปิด Dropdown เมื่อคลิกพื้นที่อื่น
      useEffect(() => {
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      // ซิงค์ข้อความค้นหากับค่าที่เลือก
      useEffect(() => {
        if (selected === 'ทั้งหมด') {
          setSearchTerm('');
        } else {
          setSearchTerm(selected);
        }
      }, [selected]);

      return (
        <div className="relative z-40" ref={containerRef}>
          <label className="block text-xs font-medium text-slate-400 mb-1.5">{label}</label>
          <div className="relative">
            <input
              type="text"
              value={searchTerm}
              onFocus={() => setIsOpen(true)}
              onChange={(e) => {
                setSearchTerm(e.target.value);
                setIsOpen(true);
                if (e.target.value === '') {
                  onSelect('ทั้งหมด');
                }
              }}
              placeholder={placeholder}
              className="w-full p-2.5 pr-8 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-[#3B82F6] transition-colors truncate"
            />
            {searchTerm && (
              <button
                type="button"
                onClick={() => {
                  setSearchTerm('');
                  onSelect('ทั้งหมด');
                }}
                className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-xs bg-slate-800 rounded-full w-4 h-4 flex items-center justify-center"
              >
                ✕
              </button>
            )}
          </div>

          {isOpen && (
            <ul className="absolute z-50 left-0 right-0 mt-1 max-h-60 overflow-y-auto bg-slate-900 border border-slate-700 rounded-xl shadow-2xl text-xs divide-y divide-slate-800/60 ring-1 ring-black/5">
              {filteredOptions.length > 0 ? (
                filteredOptions.map((opt, idx) => (
                  <li
                    key={idx}
                    onClick={() => {
                      onSelect(opt);
                      setSearchTerm(opt === 'ทั้งหมด' ? '' : opt);
                      setIsOpen(false);
                    }}
                    className={`p-2.5 hover:bg-blue-600/30 hover:text-blue-300 cursor-pointer transition-colors leading-relaxed ${
                      selected === opt ? 'bg-blue-600/40 text-blue-300 font-semibold' : 'text-slate-200'
                    }`}
                  >
                    {opt}
                  </li>
                ))
              ) : (
                <li className="p-3 text-slate-500 text-center">ไม่พบรายชื่อที่ค้นหา</li>
              )}
            </ul>
          )}
        </div>
      );
    }

    // Component Wrapper สำหรับ Chart.js
    function ChartCanvas({ type, data, options }) {
      const canvasRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = canvasRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type,
          data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: {
                  color: '#94A3B8',
                  font: { family: 'Prompt', size: 11 }
                }
              },
              tooltip: {
                callbacks: {
                  label: (context) => {
                    let label = context.dataset.label || context.label || '';
                    if (label) label += ': ';
                    
                    const value = context.raw || 0;

                    if (type === 'doughnut' || type === 'pie') {
                      const total = context.dataset.data.reduce((a, b) => a + b, 0);
                      const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : 0;
                      label += `${value.toLocaleString()} บาท (${percentage}%)`;
                    } else {
                      label += `${value.toLocaleString()} บาท`;
                    }
                    return label;
                  }
                }
              }
            },
            scales: type !== 'doughnut' ? {
              x: {
                ticks: { color: '#94A3B8', font: { family: 'Prompt', size: 10 } },
                grid: { color: 'rgba(51, 65, 85, 0.3)' }
              },
              y: {
                ticks: { color: '#94A3B8', font: { family: 'Prompt', size: 10 } },
                grid: { color: 'rgba(51, 65, 85, 0.3)' }
              }
            } : {},
            ...options
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [data, type, options]);

      return <canvas ref={canvasRef} />;
    }

    function IPIDashboard() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      // State สำหรับ Modal แสดงรายละเอียด
      const [selectedProject, setSelectedProject] = useState(null);

      // State ตัวกรอง
      const [selectedCategory, setSelectedCategory] = useState('ทั้งหมด');
      const [selectedProvince, setSelectedProvince] = useState('ทั้งหมด');
      const [selectedAgency, setSelectedAgency] = useState('ทั้งหมด');
      const [selectedWinner, setSelectedWinner] = useState('ทั้งหมด');
      
      // State ตัวกรองช่วงงบประมาณ
      const [minBudget, setMinBudget] = useState('');
      const [maxBudget, setMaxBudget] = useState('');

      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnmulpaVrWQDe_sylfiDFMFnZ7OnBXk-dmqqWWzJzf612EVjj3Y5T9baCB9E1KfPpZ/exec";

      const fetchData = async () => {
        try {
          setLoading(true);
          const response = await fetch(SCRIPT_URL);
          const jsonData = await response.json();
          setData(jsonData);
          setLoading(false);
        } catch (error) {
          console.error('Error fetching data:', error);
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      const getUniqueOptions = (key) => {
        if (!Array.isArray(data)) return ['ทั้งหมด'];
        const options = data
          .map(item => item[key])
          .filter(val => val && String(val).trim() !== '');
        return ['ทั้งหมด', ...Array.from(new Set(options)).sort()];
      };

      const categories = useMemo(() => getUniqueOptions('ประเภทงาน'), [data]);
      const provinces = useMemo(() => getUniqueOptions('จังหวัด'), [data]);
      const agencies = useMemo(() => getUniqueOptions('ชื่อหน่วยงาน'), [data]);
      const winners = useMemo(() => getUniqueOptions('รายชื่อผู้ชนะการเสนอราคา'), [data]);

      // กรองข้อมูลตาม Dropdown และช่วงงบประมาณ
      const filteredData = useMemo(() => {
        if (!Array.isArray(data)) return [];
        return data.filter(item => {
          const matchCategory = selectedCategory === 'ทั้งหมด' || item['ประเภทงาน'] === selectedCategory;
          const matchProvince = selectedProvince === 'ทั้งหมด' || item['จังหวัด'] === selectedProvince;
          const matchAgency = selectedAgency === 'ทั้งหมด' || item['ชื่อหน่วยงาน'] === selectedAgency;
          
          // ตรวจสอบการกรองผู้ชนะ
          const itemWinner = item['รายชื่อผู้ชนะการเสนอราคา'] || '';
          const matchWinner = selectedWinner === 'ทั้งหมด' || itemWinner.toLowerCase().includes(selectedWinner.toLowerCase());

          const budget = parseNumber(item['วงเงินงบประมาณ']);
          const min = minBudget !== '' ? parseNumber(minBudget) : -Infinity;
          const max = maxBudget !== '' ? parseNumber(maxBudget) : Infinity;
          const matchBudget = budget >= min && budget <= max;

          return matchCategory && matchProvince && matchAgency && matchWinner && matchBudget;
        });
      }, [data, selectedCategory, selectedProvince, selectedAgency, selectedWinner, minBudget, maxBudget]);

      // กราฟเปรียบเทียบงบประมาณ แต่ละจังหวัด
      const provinceChartData = useMemo(() => {
        const provinceMap = {};
        filteredData.forEach(item => {
          const prov = item['จังหวัด'] || 'ไม่ระบุ';
          provinceMap[prov] = (provinceMap[prov] || 0) + parseNumber(item['วงเงินงบประมาณ']);
        });

        const labels = Object.keys(provinceMap);
        const values = Object.values(provinceMap);
        const colors = labels.map((_, index) => COLOR_PALETTE[index % COLOR_PALETTE.length]);

        return {
          labels,
          datasets: [{
            label: 'งบประมาณรวม',
            data: values,
            backgroundColor: colors,
            borderColor: colors,
            borderWidth: 1,
            borderRadius: 6
          }]
        };
      }, [filteredData]);

      // กราฟสัดส่วนประเภทงาน
      const categoryChartData = useMemo(() => {
        const catMap = {};
        filteredData.forEach(item => {
          const cat = item['ประเภทงาน'] || 'ไม่ระบุ';
          catMap[cat] = (catMap[cat] || 0) + parseNumber(item['วงเงินงบประมาณ']);
        });

        const labels = Object.keys(catMap);
        const values = Object.values(catMap);

        return {
          labels,
          datasets: [{
            data: values,
            backgroundColor: COLOR_PALETTE.slice(0, labels.length),
            borderColor: '#0F172A',
            borderWidth: 2
          }]
        };
      }, [filteredData]);

      // กราฟ Top 5 ผู้ชนะการประมูล
      const topWinnersChartData = useMemo(() => {
        const winnerMap = {};
        filteredData.forEach(item => {
          const winner = item['รายชื่อผู้ชนะการเสนอราคา'];
          if (winner && winner.trim() !== '' && !winner.includes('ยกเลิก') && winner !== '-') {
            const val = parseNumber(item['มูลค่าที่จัดหาได้']) || parseNumber(item['วงเงินงบประมาณ']);
            winnerMap[winner] = (winnerMap[winner] || 0) + val;
          }
        });

        const sorted = Object.entries(winnerMap)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);

        return {
          labels: sorted.map(item => item[0]),
          datasets: [{
            label: 'มูลค่างานรวม',
            data: sorted.map(item => item[1]),
            backgroundColor: 'rgba(34, 197, 94, 0.7)',
            borderColor: '#22C55E',
            borderWidth: 1,
            borderRadius: 6
          }]
        };
      }, [filteredData]);

      return (
        <div className="p-6 max-w-7xl mx-auto space-y-6">
          
          {/* Header */}
          <header className="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl shadow-2xl relative z-10">
            <h1 className="text-3xl font-bold bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
              IPI-Dashboard
            </h1>
          </header>

          {/* Filter Section (ตั้งค่า relative z-30 เพื่อให้ลอยอยู่หน้าสุด) */}
          <div className="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-5 rounded-2xl shadow-2xl space-y-4 relative z-30">
            <div className="flex justify-between items-center pb-3 border-b border-slate-700/50">
              <h2 className="font-semibold text-slate-300 text-sm flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-[#3B82F6]"></span>
                ตัวกรองค้นหาโครงการ
              </h2>
              <span className="text-xs font-semibold text-[#3B82F6] bg-blue-500/10 border border-blue-500/20 px-3 py-1 rounded-full">
                พบ {filteredData.length} รายการ
              </span>
            </div>

            {/* Dropdown Filters */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">ประเภทงาน</label>
                <select
                  value={selectedCategory}
                  onChange={(e) => setSelectedCategory(e.target.value)}
                  className="w-full p-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-[#3B82F6]"
                >
                  {categories.map(cat => (
                    <option key={cat} value={cat} className="bg-[#0F172A] text-slate-200">{cat}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">จังหวัด</label>
                <select
                  value={selectedProvince}
                  onChange={(e) => setSelectedProvince(e.target.value)}
                  className="w-full p-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-[#3B82F6]"
                >
                  {provinces.map(prov => (
                    <option key={prov} value={prov} className="bg-[#0F172A] text-slate-200">{prov}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">หน่วยงาน</label>
                <select
                  value={selectedAgency}
                  onChange={(e) => setSelectedAgency(e.target.value)}
                  className="w-full p-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-[#3B82F6]"
                >
                  {agencies.map(agency => (
                    <option key={agency} value={agency} className="bg-[#0F172A] text-slate-200">{agency}</option>
                  ))}
                </select>
              </div>

              {/* ช่องค้นหาผู้ชนะการเสนอราคาแบบพิมพ์ค้นหาได้ */}
              <SearchableSelect
                label="ผู้ชนะการเสนอราคา"
                options={winners}
                selected={selectedWinner}
                onSelect={(val) => setSelectedWinner(val)}
                placeholder="พิมพ์ค้นหารายชื่อผู้ชนะ..."
              />
            </div>

            {/* Budget Range Filter */}
            <div className="pt-3 border-t border-slate-700/40 flex flex-wrap items-center gap-4">
              <div className="flex items-center gap-3 text-xs text-slate-300">
                <span className="font-medium text-slate-400">งบประมาณตั้งแต่</span>
                <input
                  type="text"
                  placeholder="0"
                  value={minBudget}
                  onChange={(e) => setMinBudget(formatNumberInput(e.target.value))}
                  className="w-40 sm:w-48 p-2 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs text-slate-200 font-mono focus:outline-none focus:border-[#3B82F6] transition-colors"
                />
              </div>

              <div className="flex items-center gap-3 text-xs text-slate-300">
                <span className="font-medium text-slate-400">จนถึง</span>
                <input
                  type="text"
                  placeholder="ไม่จำกัด"
                  value={maxBudget}
                  onChange={(e) => setMaxBudget(formatNumberInput(e.target.value))}
                  className="w-40 sm:w-48 p-2 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs text-slate-200 font-mono focus:outline-none focus:border-[#3B82F6] transition-colors"
                />
              </div>

              {(minBudget !== '' || maxBudget !== '' || selectedWinner !== 'ทั้งหมด') && (
                <button
                  onClick={() => { 
                    setMinBudget(''); 
                    setMaxBudget(''); 
                    setSelectedWinner('ทั้งหมด');
                  }}
                  className="text-xs text-rose-400 hover:text-rose-300 font-medium underline transition-colors"
                >
                  ล้างการค้นหา
                </button>
              )}
            </div>
          </div>

          {/* Analytics Charts Section (ตั้งค่า relative z-10 ให้ลำดับเลเยอร์ต่ำกว่ากล่องตัวกรอง) */}
          {!loading && filteredData.length > 0 && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10">
              
              {/* กราฟเปรียบเทียบงบประมาณ แต่ละจังหวัด */}
              <div className="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-5 rounded-2xl shadow-xl flex flex-col justify-between">
                <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-[#3B82F6]"></span>
                  เปรียบเทียบงบประมาณ แต่ละจังหวัด
                </h3>
                <div className="h-64 relative">
                  <ChartCanvas 
                    type="bar" 
                    data={provinceChartData} 
                    options={{
                      plugins: {
                        legend: { display: false }
                      }
                    }} 
                  />
                </div>
              </div>

              {/* กราฟสัดส่วนประเภทงาน */}
              <div className="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-5 rounded-2xl shadow-xl flex flex-col justify-between">
                <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-[#F59E0B]"></span>
                  สัดส่วนประเภทงาน (ตามงบประมาณ)
                </h3>
                <div className="h-64 relative">
                  <ChartCanvas 
                    type="doughnut" 
                    data={categoryChartData} 
                    options={{
                      plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10 } }
                      }
                    }} 
                  />
                </div>
              </div>

              {/* Top 5 ผู้ชนะการประมูล */}
              <div className="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-5 rounded-2xl shadow-xl flex flex-col justify-between">
                <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-[#22C55E]"></span>
                  Top 5 ผู้ชนะการประมูล (มูลค่าสูงสุด)
                </h3>
                <div className="h-64 relative">
                  <ChartCanvas 
                    type="bar" 
                    data={topWinnersChartData} 
                    options={{ indexAxis: 'y' }} 
                  />
                </div>
              </div>

            </div>
          )}

          {/* Cards Grid Section */}
          {loading ? (
            <div className="text-center py-24 text-slate-400 font-light flex flex-col items-center justify-center gap-3">
              <div className="w-8 h-8 border-2 border-[#3B82F6] border-t-transparent rounded-full animate-spin"></div>
              กำลังโหลดข้อมูลจาก Google Sheets...
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 relative z-0">
              {filteredData.length > 0 ? (
                filteredData.map((project, index) => {
                  const budgetNum = parseNumber(project['วงเงินงบประมาณ']);
                  const procureNum = parseNumber(project['มูลค่าที่จัดหาได้']);
                  const savingsNum = budgetNum - procureNum;
                  
                  const savingsPercent = budgetNum > 0 ? ((savingsNum / budgetNum) * 100).toFixed(2) : 0;

                  return (
                    <div 
                      key={index} 
                      onClick={() => setSelectedProject(project)}
                      className="bg-slate-800/40 backdrop-blur-xl p-5 rounded-2xl border border-slate-700/50 hover:border-[#3B82F6] transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-blue-500/10 cursor-pointer flex flex-col justify-between group relative overflow-hidden"
                    >
                      <div>
                        <div className="flex justify-between items-center mb-3">
                          <span className="text-[11px] px-2.5 py-0.5 bg-blue-500/10 text-[#3B82F6] font-medium rounded-full border border-blue-500/20">
                            {project['ประเภทงาน'] || 'ไม่ระบุประเภท'}
                          </span>
                          <span className="text-xs text-slate-400 font-mono bg-slate-900/60 px-2 py-0.5 rounded border border-slate-700/50">
                            {project['เลขที่โครงการ'] || '-'}
                          </span>
                        </div>

                        <div className="mb-4 space-y-1">
                          <h3 className="font-semibold text-slate-100 text-sm group-hover:text-blue-300 transition-colors line-clamp-1" title={project['ชื่อหน่วยงาน']}>
                            🏛️ {project['ชื่อหน่วยงาน'] || '-'}
                          </h3>
                          <p className="text-xs text-slate-400 flex items-center gap-1">
                            <span>📍</span> จังหวัด: <span className="text-slate-200 font-medium">{project['จังหวัด'] || '-'}</span>
                          </p>
                        </div>
                      </div>

                      <div className="border-t border-slate-700/50 pt-3 text-xs text-slate-300 space-y-2 bg-slate-900/50 -mx-5 -mb-5 p-4 rounded-b-2xl">
                        
                        <div className="flex justify-between items-center">
                          <span className="text-slate-400">วงเงินงบประมาณ:</span>
                          <span className="font-semibold text-slate-100 font-mono">
                            {budgetNum > 0 ? budgetNum.toLocaleString() + ' บาท' : '-'}
                          </span>
                        </div>

                        <div className="flex justify-between items-center">
                          <span className="text-slate-400">มูลค่าที่จัดหาได้:</span>
                          <span className="font-medium text-slate-200 font-mono">
                            {procureNum > 0 ? procureNum.toLocaleString() + ' บาท' : '-'}
                          </span>
                        </div>

                        <div className="flex justify-between items-center">
                          <span className="text-slate-400">ประหยัดได้:</span>
                          <span className={`font-semibold font-mono ${savingsNum > 0 ? 'text-emerald-400' : 'text-slate-400'}`}>
                            {savingsNum > 0 
                              ? `${savingsNum.toLocaleString()} บาท (${savingsPercent}%)` 
                              : '0 บาท (0%)'}
                          </span>
                        </div>

                        <div className="flex justify-between items-center pt-1 border-t border-slate-800">
                          <span className="text-slate-400">ผู้ชนะ:</span>
                          <span className="font-medium text-[#22C55E] truncate max-w-[160px]" title={project['รายชื่อผู้ชนะการเสนอราคา']}>
                            {project['รายชื่อผู้ชนะการเสนอราคา'] || '-'}
                          </span>
                        </div>

                        <div className="text-[11px] text-blue-400 text-center pt-2 font-medium flex items-center justify-center gap-1 group-hover:underline">
                          🔍 คลิกเพื่อดูรายละเอียดงานและสถานที่
                        </div>
                      </div>
                    </div>
                  );
                })
              ) : (
                <div className="col-span-full text-center py-20 bg-slate-800/20 backdrop-blur-md rounded-2xl text-slate-400 border border-dashed border-slate-700/60">
                  ไม่พบข้อมูลโครงการตามเงื่อนไขที่เลือก
                </div>
              )}
            </div>
          )}

          {/* Modal Pop-up */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md animate-fade-in">
              <div 
                className="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative space-y-5 max-h-[90vh] overflow-y-auto"
                onClick={(e) => e.stopPropagation()}
              >
                <button 
                  onClick={() => setSelectedProject(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-2 rounded-full transition-colors"
                >
                  ✕
                </button>

                <div className="border-b border-slate-800 pb-3">
                  <span className="text-xs px-2.5 py-1 bg-blue-500/10 text-[#3B82F6] font-medium rounded-full border border-blue-500/20">
                    {selectedProject['ประเภทงาน'] || 'โครงการ'}
                  </span>
                  <h2 className="text-xl font-bold text-white mt-2">
                    {selectedProject['รายละเอียดงาน'] || 'ไม่มีรายละเอียดงาน'}
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    เลขที่โครงการ: <span className="font-mono text-slate-300">{selectedProject['เลขที่โครงการ'] || '-'}</span>
                  </p>
                </div>

                <div className="space-y-4 text-sm text-slate-300">
                  <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 space-y-2">
                    <p>🏛️ <span className="text-slate-400">หน่วยงาน:</span> {selectedProject['ชื่อหน่วยงาน'] || '-'}</p>
                    <p>📍 <span className="text-slate-400">จังหวัด:</span> {selectedProject['จังหวัด'] || '-'}</p>
                    <p>🏆 <span className="text-slate-400">ผู้ชนะการเสนอราคา:</span> <span className="text-emerald-400 font-medium">{selectedProject['รายชื่อผู้ชนะการเสนอราคา'] || '-'}</span></p>
                  </div>

                  <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                    <h4 className="text-xs font-semibold text-slate-400 mb-1">📍 สถานที่ดำเนินโครงการ:</h4>
                    <p className="text-slate-200 leading-relaxed">
                      {selectedProject['สถานที่'] || 'ไม่ระบุข้อมูลสถานที่'}
                    </p>
                  </div>

                  <div className="grid grid-cols-3 gap-3 pt-2 text-center">
                    <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50">
                      <p className="text-[11px] text-slate-400">งบประมาณ</p>
                      <p className="font-bold text-white font-mono text-xs mt-1">
                        {parseNumber(selectedProject['วงเงินงบประมาณ']).toLocaleString()} ฿
                      </p>
                    </div>
                    <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50">
                      <p className="text-[11px] text-slate-400">จัดหาได้</p>
                      <p className="font-bold text-slate-200 font-mono text-xs mt-1">
                        {parseNumber(selectedProject['มูลค่าที่จัดหาได้']).toLocaleString()} ฿
                      </p>
                    </div>
                    <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50">
                      <p className="text-[11px] text-slate-400">ประหยัดได้</p>
                      <p className="font-bold text-emerald-400 font-mono text-xs mt-1">
                        {(parseNumber(selectedProject['วงเงินงบประมาณ']) - parseNumber(selectedProject['มูลค่าที่จัดหาได้'])).toLocaleString()} ฿
                        <span className="block text-[10px] text-emerald-300 font-normal">
                          ({parseNumber(selectedProject['วงเงินงบประมาณ']) > 0 
                            ? (((parseNumber(selectedProject['วงเงินงบประมาณ']) - parseNumber(selectedProject['มูลค่าที่จัดหาได้'])) / parseNumber(selectedProject['วงเงินงบประมาณ'])) * 100).toFixed(2) 
                            : 0}%)
                        </span>
                      </p>
                    </div>
                  </div>
                </div>

                <div className="pt-2">
                  <button 
                    onClick={() => setSelectedProject(null)}
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-xs transition-colors"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IPIDashboard />);
  </script>
</body>
</html>
