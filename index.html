<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPI-Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel สำหรับแปลงไวยากรณ์ React บนเบราว์เซอร์ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function IPIDashboard() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState('ทั้งหมด');

      // ใส่ URL จาก Apps Script เรียบร้อยแล้ว
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7Mz9UilmHldUjjYq1KbL-R3rfkb0zkQhJlvcclKL5ezl8EnMla7Snl0hDIqQCk2S/exec";

      // กำหนดหมวดหมู่งาน 3 หมวด
      const categories = [
        'ทั้งหมด',
        'แอสฟัลต์ติกคอนกรีต',
        'ก่อสร้างอาคาร',
        'ถนนคอนกรีตเสริมเหล็ก'
      ];

      const fetchData = async () => {
        try {
          setLoading(true);
          const response = await fetch(SCRIPT_URL);
          const jsonData = await response.json();
          setData(jsonData);
          setLoading(false);
        } catch (error) {
          console.error('Error fetching data:', error);
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // กรองข้อมูลตามหมวดหมู่ที่เลือก (เช็กทั้งชื่อคอลัมน์ 'หมวดหมู่งาน' หรือ 'Category')
      const filteredData = selectedCategory === 'ทั้งหมด'
        ? data
        : data.filter(item => (item.หมวดหมู่งาน || item.Category) === selectedCategory);

      return (
        <div className="p-6 max-w-6xl mx-auto">
          <header className="mb-8 border-b pb-4">
            <h1 className="text-3xl font-bold text-gray-800">IPI-Dashboard</h1>
            <p className="text-gray-500">ระบบติดตามสถานะโครงการก่อสร้างแบบ Real-time</p>
          </header>

          {/* เลือกประเภทงาน 3 หมวด */}
          <div className="mb-6 flex items-center gap-3">
            <label className="font-semibold text-gray-700">เลือกประเภทงาน:</label>
            <select
              value={selectedCategory}
              onChange={(e) => setSelectedCategory(e.target.value)}
              className="p-2 border rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              {categories.map(cat => (
                <option key={cat} value={cat}>{cat}</option>
              ))}
            </select>
          </div>

          {/* การแสดงผลข้อมูล */}
          {loading ? (
            <div className="text-center py-12 text-gray-600 font-medium">
              กำลังโหลดข้อมูลแบบ Real-time จาก Google Sheets...
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredData.length > 0 ? (
                filteredData.map((project, index) => (
                  <div key={index} className="bg-white p-5 rounded-lg shadow-md border border-gray-100 hover:shadow-lg transition-shadow">
                    <h3 className="font-bold text-lg text-gray-800 mb-2">
                      {project.ชื่อโครงการ || project.ProjectName || 'ไม่มีชื่อโครงการ'}
                    </h3>
                    <p className="text-sm text-gray-600">
                      <span className="font-semibold">ประเภท:</span> {project.หมวดหมู่งาน || project.Category || '-'}
                    </p>
                  </div>
                ))
              ) : (
                <div className="col-span-full text-center py-8 text-gray-500">
                  ไม่พบข้อมูลโครงการในหมวดหมู่นี้
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IPIDashboard />);
  </script>
</body>
</html>
