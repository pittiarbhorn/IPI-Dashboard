<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPI-Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function IPIDashboard() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState('ทั้งหมด');

      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7Mz9UilmHldUjjYq1KbL-R3rfkb0zkQhJlvcclKL5ezl8EnMla7Snl0hDIqQCk2S/exec";

      // ตัวเลือกหมวดหมู่ตรงตามคอลัมน์ 'ประเภทงาน' ใน Sheet
      const categories = [
        'ทั้งหมด',
        'แอสฟัลติกคอนกรีต',
        'ก่อสร้างอาคาร',
        'ถนนคอนกรีตเสริมเหล็ก'
      ];

      const fetchData = async () => {
        try {
          setLoading(true);
          const response = await fetch(SCRIPT_URL);
          const jsonData = await response.json();
          setData(jsonData);
          setLoading(false);
        } catch (error) {
          console.error('Error fetching data:', error);
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // กรองข้อมูลด้วยคอลัมน์ 'ประเภทงาน'
      const filteredData = selectedCategory === 'ทั้งหมด'
        ? data
        : data.filter(item => item['ประเภทงาน'] === selectedCategory);

      return (
        <div className="p-6 max-w-7xl mx-auto">
          <header className="mb-6 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h1 className="text-3xl font-bold text-gray-800">IPI-Dashboard</h1>
            <p className="text-gray-500 text-sm mt-1">ระบบติดตามโครงการ EGP (ข้อมูลจาก Google Sheets)</p>
          </header>

          {/* แถบกรองข้อมูล */}
          <div className="mb-6 flex items-center gap-3 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <label className="font-semibold text-gray-700">ประเภทงาน:</label>
            <select
              value={selectedCategory}
              onChange={(e) => setSelectedCategory(e.target.value)}
              className="p-2 border rounded-lg shadow-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700"
            >
              {categories.map(cat => (
                <option key={cat} value={cat}>{cat}</option>
              ))}
            </select>
            <span className="ml-auto text-sm text-gray-500">
              พบ {filteredData.length} รายการ
            </span>
          </div>

          {/* แสดงการ์ดข้อมูล */}
          {loading ? (
            <div className="text-center py-20 text-gray-600 font-medium">
              กำลังโหลดข้อมูลจาก Google Sheets...
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredData.length > 0 ? (
                filteredData.map((project, index) => (
                  <div key={index} className="bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-2 gap-2">
                        <span className="text-xs px-2.5 py-1 bg-blue-50 text-blue-700 font-medium rounded-full border border-blue-100">
                          {project['ประเภทงาน'] || 'ไม่ระบุประเภท'}
                        </span>
                        <span className="text-xs text-gray-400 font-mono">
                          {project['เลขที่โครงการ']}
                        </span>
                      </div>

                      <h3 className="font-bold text-gray-800 text-base mb-2 line-clamp-2" title={project['รายละเอียดงาน']}>
                        {project['รายละเอียดงาน'] || 'ไม่มีรายละเอียดงาน'}
                      </h3>

                      <p className="text-xs text-gray-500 mb-3">
                        <span className="font-semibold text-gray-600">หน่วยงาน:</span> {project['ชื่อหน่วยงาน'] || '-'}
                      </p>
                    </div>

                    <div className="border-t pt-3 mt-2 text-xs text-gray-600 space-y-1 bg-gray-50 -mx-5 -mb-5 p-4 rounded-b-xl">
                      <div className="flex justify-between">
                        <span>วงเงินงบประมาณ:</span>
                        <span className="font-semibold text-gray-800">
                          {project['วงเงินงบประมาณ'] ? Number(project['วงเงินงบประมาณ']).toLocaleString() + ' บาท' : '-'}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>ผู้ชนะการเสนอราคา:</span>
                        <span className="font-medium text-emerald-700 truncate max-w-[150px]" title={project['รายชื่อผู้ชนะการเสนอราคา']}>
                          {project['รายชื่อผู้ชนะการเสนอราคา'] || '-'}
                        </span>
                      </div>
                      {project['สถานที่'] && (
                        <div className="text-gray-500 pt-1 border-t border-gray-200 text-[11px]">
                          📍 {project['สถานที่']}
                        </div>
                      )}
                    </div>
                  </div>
                ))
              ) : (
                <div className="col-span-full text-center py-16 bg-white rounded-xl text-gray-500 border border-dashed border-gray-300">
                  ไม่พบข้อมูลโครงการในหมวดหมู่นี้
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IPIDashboard />);
  </script>
</body>
</html>
